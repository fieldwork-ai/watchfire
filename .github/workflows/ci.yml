name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    # arm64 runners: every engine below must have a Linux arm64 build in the
    # pinned Playwright, or its shard fails at `playwright install`. All three
    # do today; check before adding a fourth.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # The engine matrix is the point: `error.stack` is not standardized,
        # and the three families disagree on the header line, the frame
        # separator, and which frames exist at all. A browser update that
        # changes the format must fail here rather than silently degrading
        # every downstream user's stack traces.
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build fixture app
        run: |
          pnpm --dir e2e/fixture-next install --no-frozen-lockfile
          pnpm --dir e2e/fixture-next build
          cp -r e2e/fixture-next/.next/static \
            e2e/fixture-next/.next/standalone/e2e/fixture-next/.next/
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
